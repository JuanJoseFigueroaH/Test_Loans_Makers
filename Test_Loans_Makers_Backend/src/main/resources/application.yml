spring:
  application:
    name: bank-loan-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loans_db}
    username: ${DB_USERNAME:bankloan}
    password: ${DB_PASSWORD:bankloan_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  main:
    web-application-type: reactive

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5RG9Ob3RVc2VJblByb2R1Y3Rpb24xMjM0NTY3ODk=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [requestId=%X{requestId:-}] [userId=%X{userId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.bankloan: DEBUG
    org.springframework.security: DEBUG
