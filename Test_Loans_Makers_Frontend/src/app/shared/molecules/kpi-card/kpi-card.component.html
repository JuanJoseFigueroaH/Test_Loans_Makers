<button class="bg-white rounded-card border border-gray-100 shadow-xs p-5 flex items-center gap-4 cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-card hover:border-gray-200 w-full text-left max-[360px]:p-3 max-[360px]:gap-3"
        [attr.aria-pressed]="active"
        (click)="cardClick.emit()">
  <div class="w-11 h-11 rounded-lg flex items-center justify-center flex-shrink-0"
       [ngClass]="iconBgClass">
    <mat-icon class="!text-white !text-[22px] !w-[22px] !h-[22px]">{{ icon }}</mat-icon>
  </div>
  <div class="flex flex-col gap-0.5">
    <span class="text-[22px] font-bold text-gray-900 leading-none max-[360px]:text-lg">{{ value }}</span>
    <span class="text-xs text-gray-500 font-medium uppercase tracking-wide">{{ label }}</span>
  </div>
</button>
