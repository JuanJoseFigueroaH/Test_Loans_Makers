<mat-card class="!rounded-card !border !border-gray-100 !shadow-xs cursor-pointer transition-all hover:-translate-y-0.5 hover:!shadow-card hover:!border-gray-200 !bg-white"
         (click)="cardClick.emit()"
         (keydown.enter)="cardClick.emit()"
         tabindex="0"
         [attr.aria-label]="'Préstamo por ' + (amount | currency:'COP':'symbol-narrow':'1.0-0') + ' - ' + statusLabel">
  <mat-card-content>
    <div class="flex justify-between items-center mb-3">
      <app-status-badge [status]="status"></app-status-badge>
      <span class="text-xs text-gray-400 font-medium">{{ date | date:'dd/MM/yyyy' }}</span>
    </div>
    <div class="text-2xl font-bold text-gray-900 mb-3 tracking-tight">
      {{ amount | currency:'COP':'symbol-narrow':'1.0-0' }}
    </div>
    <div class="flex gap-4 mb-3">
      <div class="flex items-center gap-2 text-[13px] text-gray-500">
        <mat-icon class="!text-base !w-4 !h-4 text-gray-400">calendar_month</mat-icon>
        <span>{{ termMonths }} meses</span>
      </div>
    </div>
    @if (rejectionReason) {
      <div class="flex items-start gap-2 p-3 bg-red-50 border border-red-100 rounded-lg text-[13px] text-red-700 mb-3 leading-normal" role="note">
        <mat-icon class="!text-base !w-4 !h-4 flex-shrink-0 mt-0.5 text-red-500">info</mat-icon>
        <span>{{ rejectionReason }}</span>
      </div>
    }
    @if (reviewedAt) {
      <div class="flex items-center gap-2 text-xs text-gray-400 mb-3">
        <mat-icon class="!text-sm !w-3.5 !h-3.5">schedule</mat-icon>
        <span>Revisado: {{ reviewedAt | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
    }
    <div class="pt-3 border-t border-gray-100 text-right">
      <button mat-stroked-button class="inline-flex items-center gap-2 !text-[13px] !text-blue-600 !font-medium" tabindex="-1">
        <mat-icon>visibility</mat-icon>
        Ver Detalle
      </button>
    </div>
  </mat-card-content>
</mat-card>
